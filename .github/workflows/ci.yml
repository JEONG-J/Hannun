name: CI

# 로컬과 같은 툴체인(mise 로 고정한 tuist)으로 generate → inspect → build → test 를 돌린다.
# 명령은 전부 Makefile 을 거친다 — CI 와 로컬이 갈라지지 않게 하려는 의도다.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 PR 에 새 커밋이 올라오면 이전 실행을 취소한다. main 푸시는 취소하지 않는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # ⚠︎ 사람이 확인 필요: 러너에 설치된 Xcode 앱 경로 (이미지마다 마이너 버전이 다르다).
  #    경로가 없으면 아래 "Xcode 선택" 스텝이 설치 목록을 출력하고 실패한다.
  XCODE_APP: /Applications/Xcode_26.0.app

  # ⚠︎ 사람이 확인 필요: 러너 이미지에 존재하는 시뮬레이터 이름이어야 한다.
  #    Makefile 기본값과 맞춰 두었고, 실패 시 "시뮬레이터 목록" 스텝 로그로 대조한다.
  DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro

  # Makefile 의 DERIVED_DATA 오버라이드. 경로를 고정해야 캐시를 걸 수 있다.
  DERIVED_DATA: .derived-data

  # mise 를 비대화형으로 실행 (설치·신뢰 확인 프롬프트 생략)
  MISE_YES: "1"

jobs:
  build-and-test:
    # ⚠︎ 사람이 확인 필요: 러너 이미지 라벨. iOS 26 SDK 가 올라간 이미지여야 한다.
    #    사용 가능한 라벨은 https://github.com/actions/runner-images 에서 확인한다.
    #    (`runs-on` 은 env 컨텍스트를 못 쓰므로 변수로 뺄 수 없다.)
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Xcode 선택
        run: |
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP 가 러너에 없습니다. 아래 목록에서 골라 XCODE_APP 을 고치세요."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone
          # 러너 이미지가 Xcode 를 올리면 DerivedData 캐시도 함께 무효화되게 빌드 번호를 남긴다.
          echo "XCODE_BUILD=$(xcodebuild -version | tail -1 | awk '{ print $NF }')" >> "$GITHUB_ENV"

      - name: mise 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/mise
            ~/.cache/mise
          key: ${{ runner.os }}-mise-${{ hashFiles('mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-mise-

      - name: mise 설치
        run: |
          if ! command -v mise >/dev/null 2>&1; then
            curl -fsSL https://mise.run | sh
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 툴체인 설치 (mise.toml 의 tuist 버전)
        run: |
          mise trust
          make bootstrap

      - name: DerivedData 캐시
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA }}
          key: ${{ runner.os }}-derived-${{ env.XCODE_BUILD }}-${{ hashFiles('**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-derived-${{ env.XCODE_BUILD }}-

      - name: 워크스페이스 생성
        run: make generate

      # 전이 링크로 심볼이 풀리면 의존성 선언이 빠져도 빌드는 통과한다.
      # 사람이 잊는 검사라서 빌드보다 먼저, 독립 스텝으로 돌린다.
      - name: 암묵적 의존성 검사
        run: make inspect

      - name: 시뮬레이터 목록
        run: make sims

      - name: 전체 빌드
        run: make build-all

      - name: 전체 테스트
        run: make test-all
